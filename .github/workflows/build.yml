name: Build Ritual Codec

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            au: 'OFF'
            vst3: 'ON'
            python: python
            apple_universal: 'OFF'
          - platform: macos-universal
            os: macos-14
            au: 'ON'
            vst3: 'ON'
            python: python3
            apple_universal: 'ON'
          - platform: linux-x64
            os: ubuntu-24.04
            au: 'OFF'
            vst3: 'ON'
            python: python3
            apple_universal: 'OFF'

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            xauth \
            xvfb

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DRITUAL_BUILD_CLI=ON
            -DRITUAL_BUILD_VST3=${{ matrix.vst3 }}
            -DRITUAL_BUILD_AU=${{ matrix.au }}
            -DRITUAL_BUILD_TESTS=ON
          )
          if [[ '${{ matrix.apple_universal }}' == 'ON' ]]; then
            cmake_args+=( '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' )
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir build --build-config Release --output-on-failure
          else
            ctest --test-dir build --build-config Release --output-on-failure
          fi

      - name: Validate Audio Unit bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          au_path="$(find build -type d -name '*.component' -print -quit)"
          test -n "$au_path"
          /usr/bin/plutil -lint "$au_path/Contents/Info.plist"
          test -x /usr/bin/auval
          # Sign the build output too, so the packaged AU matches what we validate.
          /usr/bin/codesign --force --sign - --timestamp=none "$au_path"
          /usr/bin/codesign --verify --strict --verbose=2 "$au_path"
          /usr/bin/plutil -p "$au_path/Contents/Info.plist"
          host_components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$host_components"
          staged_path="$host_components/$(basename "$au_path")"
          if [[ -e "$staged_path" ]]; then
            echo "refusing to overwrite existing AU component: $staged_path" >&2
            exit 1
          fi
          trap 'rm -rf "$staged_path"' EXIT
          ditto "$au_path" \
            "$staged_path"
          # A new AU may not be visible to the runner's cached registrar yet.
          /usr/bin/killall -u "$(id -un)" AudioComponentRegistrar || true
          registered=false
          for attempt in {1..15}; do
            /usr/bin/auval -a > "$RUNNER_TEMP/ritual-au-components.txt"
            if awk '$1 == "aufx" && $2 == "RtCd" && $3 == "Crrb" { found=1 } END { exit !found }' \
                "$RUNNER_TEMP/ritual-au-components.txt"; then
              registered=true
              break
            fi
            sleep 2
          done
          if [[ "$registered" != true ]]; then
            cat "$RUNNER_TEMP/ritual-au-components.txt"
            echo "Ritual AU was not registered within 30 seconds" >&2
            exit 1
          fi
          # Retry discovery only; any actual validation failure remains fatal.
          /usr/bin/auval -v aufx RtCd Crrb

      - name: Sign completed VST3 bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          vst3_path="$(find build -type d -name '*.vst3' -print -quit)"
          test -n "$vst3_path"
          # moduleinfo.json is generated after linking; sign the completed bundle.
          /usr/bin/codesign --force --sign - --timestamp=none "$vst3_path"
          /usr/bin/codesign --verify --strict "$vst3_path"

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python }} tools/package_release.py \
            --build-dir build \
            --output-dir dist \
            --platform '${{ matrix.platform }}'
          test -f "dist/ritual-codec-${{ matrix.platform }}-cli.zip"
          test -f "dist/ritual-codec-${{ matrix.platform }}-vst3.zip"
          if [[ '${{ matrix.au }}' == 'ON' ]]; then
            test -f "dist/ritual-codec-${{ matrix.platform }}-au.zip"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          archive: false
          path: dist/ritual-codec-${{ matrix.platform }}-cli.zip
          if-no-files-found: error

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          archive: false
          path: dist/ritual-codec-${{ matrix.platform }}-vst3.zip
          if-no-files-found: error

      - name: Upload AU artifact
        if: matrix.au == 'ON'
        uses: actions/upload-artifact@v7.0.1
        with:
          archive: false
          path: dist/ritual-codec-${{ matrix.platform }}-au.zip
          if-no-files-found: error
